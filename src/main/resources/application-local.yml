spring:
  application:
    name: zipitda

  datasource:
    url: jdbc:mysql://localhost:3306/zipitda_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
